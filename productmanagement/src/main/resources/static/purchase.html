<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ödeme</title>
</head>
<body>
    <h1>Ödeme Sayfası</h1>
    <p id="order-info">Sipariş ID: ...</p>
    <button onclick="handlePayment(true)">SUCCESS</button>
    <button onclick="handlePayment(false)">FAILED</button>

<script>
    const token = localStorage.getItem('token');
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    if (!token) { 
        window.location.href = 'login.html'; 
    }

    if (!orderId) {
        document.getElementById('order-info').textContent = "Sipariş ID bulunamadı!";
        document.querySelectorAll('button').forEach(b => b.disabled = true);
    } else {
        document.getElementById('order-info').textContent = `Sipariş ID: ${orderId}`;
    }

    async function handlePayment(isSuccess) {
        const endpoint = isSuccess ? 'complete' : 'fail';
        const url = `http://localhost:8080/api/orders/${orderId}/${endpoint}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => null);
                const errorMessage = errorData && errorData.message ? errorData.message : "İşlem gerçekleştirilemedi.";
                throw new Error(errorMessage);
            }

            const resultMessage = isSuccess 
                ? `Siparişiniz (ID: ${orderId}) başarıyla tamamlandı!` 
                : `Ödeme başarısız oldu. Siparişiniz (ID: ${orderId}) iptal edildi.`;
            
            alert(resultMessage);
            window.location.href = 'products.html';

        } catch (error) {
            console.error("Ödeme işlenirken hata:", error);
            alert("Bir hata oluştu: " + error.message);
        }
    }
</script>

</body>
</html>
