<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sepetim</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
        input[type=number] {
            width: 60px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
<h1 style="text-align:center;">Sepetim</h1>
<table>
    <thead>
    <tr>
        <th>Ürün</th>
        <th>Fiyat</th>
        <th>Miktar</th>
        <th>Toplam</th>
        <th>İşlem</th>
    </tr>
    </thead>
    <tbody id="cartItems">
    <!-- Sepet ürünleri buraya JS ile eklenecek -->
    </tbody>
</table>

<script>
    const token = localStorage.getItem('token'); // JWT token

    // Sepet verilerini getir ve tabloya ekle
    async function loadCart() {
        try {
            const response = await fetch('http://localhost:8080/api/cart', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            if (!response.ok) throw new Error("Sepet yüklenemedi");
            const cartItems = await response.json();

            const tbody = document.getElementById('cartItems');
            tbody.innerHTML = '';

            cartItems.forEach(item => {
                const tr = document.createElement('tr');

                tr.innerHTML = `
                <td>${item.product.name}</td>
                <td>${item.product.price}</td>
                <td>
                    <input type="number" min="1" value="${item.quantity}" onchange="updateQuantity(${item.id}, this.value)">
                </td>
                <td>${(item.product.price * item.quantity).toFixed(2)}</td>
                <td>
                    <button onclick="removeItem(${item.id})">Sil</button>
                </td>
            `;

                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error(error);
            alert("Sepet yüklenirken hata oluştu");
        }
    }

    // Miktarı güncelle
    async function updateQuantity(id, quantity) {
        try {
            const response = await fetch(`http://localhost:8080/api/cart/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ quantity: parseInt(quantity) })
            });
            if (!response.ok) throw new Error("Miktar güncellenemedi");
            loadCart();
        } catch (error) {
            console.error(error);
            alert("Miktar güncellenirken hata oluştu");
        }
    }

    // Ürünü sil
    async function removeItem(id) {
        try {
            const response = await fetch(`http://localhost:8080/api/cart/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            if (!response.ok) throw new Error("Ürün silinemedi");
            loadCart();
        } catch (error) {
            console.error(error);
            alert("Ürün silinirken hata oluştu");
        }
    }

    // Sayfa yüklendiğinde sepeti yükle
    window.onload = loadCart;
</script>
</body>
</html>
