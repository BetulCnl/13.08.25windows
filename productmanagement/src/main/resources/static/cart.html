<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sepetim</title>
    <style>
        body {
            font-family: sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        input[type=number] {
            width: 60px;
            padding: 5px;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
        }
        .checkout-container {
            text-align: center;
            margin-top: 20px;
        }
        .checkout-btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<header style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #f1f1f1; margin-bottom: 20px;">
  <div id="userInfo"></div>
  <button onclick="logout()">Çıkış Yap</button>
</header>
<h1 style="text-align:center;">Sepetim</h1>
<table>
    <thead>
    <tr>
        <th>Ürün</th>
        <th>Fiyat</th>
        <th>Miktar</th>
        <th>Toplam</th>
        <th>İşlem</th>
    </tr>
    </thead>
    <tbody id="cartItems">
    <!-- Sepet ürünleri buraya JS ile eklenecek -->
    </tbody>
</table>

<div class="checkout-container">
    <button class="checkout-btn" onclick="checkout()">Ödemeye Geç</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const userInfo = document.getElementById('userInfo');
        const userName = localStorage.getItem('userName');
        const userEmail = localStorage.getItem('userEmail');

        if (userName && userEmail) {
        userInfo.innerHTML = `<strong>Kullanıcı:</strong> ${userName} (${userEmail})`;
        }
    });

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('userName');
        localStorage.removeItem('userEmail');
        window.location.href = 'login.html';
    }

    const token = localStorage.getItem('token'); // JWT token

    if (!token) {
        window.location.href = 'login.html'; // Token yoksa login sayfasına yönlendir
    }

    // Sepet verilerini getir ve tabloya ekle
    async function loadCart() {
        try {
            const response = await fetch('http://localhost:8080/api/cart', {
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            if (response.status === 401) {
                 window.location.href = 'login.html';
            }
            if (!response.ok) throw new Error("Sepet yüklenemedi");
            const cartItems = await response.json();

            const tbody = document.getElementById('cartItems');
            tbody.innerHTML = '';

            if (cartItems.length === 0) {
                document.querySelector('.checkout-btn').disabled = true;
                document.querySelector('.checkout-btn').style.backgroundColor = 'grey';
            }

            cartItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                <td>${item.product.name}</td>
                <td>${item.product.price.toFixed(2)} ₺</td>
                <td>
                    <input type="number" min="1" value="${item.quantity}" onchange="updateQuantity(${item.id}, this.value)">
                </td>
                <td>${(item.product.price * item.quantity).toFixed(2)} ₺</td>
                <td>
                    <button class="delete-btn" onclick="removeItem(${item.id})">Sil</button>
                </td>
            `;
                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error(error);
            alert("Sepet yüklenirken hata oluştu: " + error.message);
        }
    }

    // Miktarı güncelle
    async function updateQuantity(id, quantity) {
        try {
            const response = await fetch(`http://localhost:8080/api/cart/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ quantity: parseInt(quantity) })
            });
            if (!response.ok) throw new Error("Miktar güncellenemedi");
            loadCart();
        } catch (error) {
            console.error(error);
            alert("Miktar güncellenirken hata oluştu: " + error.message);
        }
    }

    // Ürünü sil
    async function removeItem(id) {
        try {
            const response = await fetch(`http://localhost:8080/api/cart/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });
            if (!response.ok) throw new Error("Ürün silinemedi");
            loadCart();
        } catch (error) {
            console.error(error);
            alert("Ürün silinirken hata oluştu: " + error.message);
        }
    }

    // Checkout işlemini yap ve sonucu bildir
    async function checkout() {
        if (document.getElementById('cartItems').children.length === 0) {
            alert("Sepetiniz boş. Lütfen ödeme yapmak için ürün ekleyin.");
            return;
        }

        const checkoutBtn = document.querySelector('.checkout-btn');
        checkoutBtn.disabled = true;
        checkoutBtn.textContent = 'İşlem Yapılıyor...';

        try {
            const response = await fetch('http://localhost:8080/api/orders', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            // Cevap başarılı değilse, JSON'dan hata mesajını oku ve fırlat
            if (!response.ok) {
                const errorResponse = await response.json();
                // Bizim backend'den gelen hata formatımız { "error": "mesaj" } şeklinde olabilir
                // veya doğrudan bir mesaj dönebilir. Esnek bir şekilde yakalayalım.
                const message = errorResponse.error || errorResponse.message || "Bilinmeyen bir hata oluştu.";
                throw new Error(message);
            }

            // Başarılı cevap
            const order = await response.json();
            window.location.href = `purchase.html?orderId=${order.id}`;

        } catch (error) {
            console.error('Checkout Hatası:', error);
            alert(`Bir hata oluştu: ${error.message}`);
        } finally {
            checkoutBtn.disabled = false;
            checkoutBtn.textContent = 'Ödemeyi Tamamla';
        }
    }

    // Sayfa yüklendiğinde sepeti yükle
    window.onload = loadCart;
</script>
</body>
</html>
