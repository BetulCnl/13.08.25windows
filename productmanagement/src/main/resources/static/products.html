<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ürün Kataloğu</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
    input, select, button { padding:8px; font-size:14px; cursor: pointer; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
    .card { border:1px solid #ddd; border-radius:8px; padding:12px; display: flex; flex-direction: column; justify-content: space-between; }
    .name { font-weight: 700; margin-bottom: 4px; }
    .price { color:#0a7; font-weight:700; }
    .muted { color:#666; font-size: 12px; }
    .row { display:flex; justify-content:space-between; align-items:center; margin-top: 8px;}
    .pagination { margin-top:16px; display:flex; gap:8px; align-items:center; }
  </style>
</head>
<body>
  <h2>Ürün Kataloğu</h2>
  <div class="toolbar">
    <input id="search" placeholder="İsim ara..." />
    <input id="category" placeholder="Kategori" />
    <input id="minPrice" type="number" step="0.01" placeholder="Min fiyat" />
    <input id="maxPrice" type="number" step="0.01" placeholder="Max fiyat" />
    <button onclick="applyFilters()">Uygula</button>
    <button onclick="location.href='cart.html'" style="margin-left: auto;">Sepetim</button>
  </div>
  <div id="list" class="grid"></div>
  <div class="pagination">
    <button onclick="prevPage()">Önceki</button>
    <span id="pageInfo" class="muted"></span>
    <button onclick="nextPage()">Sonraki</button>
  </div>

<script>
  let page = 0;
  const size = 12;
  const base = window.location.origin;

  async function fetchProducts() {
    const search = document.getElementById('search').value.trim();
    const category = document.getElementById('category').value.trim();
    const minPrice = document.getElementById('minPrice').value.trim();
    const maxPrice = document.getElementById('maxPrice').value.trim();

    let url = `${base}/api/products?page=${page}&size=${size}`;
    if (search) {
      url = `${base}/api/products/search?name=${encodeURIComponent(search)}&page=${page}&size=${size}`;
    } else {
      const params = [];
      if (category) params.push(`category=${encodeURIComponent(category)}`);
      if (minPrice) params.push(`minPrice=${encodeURIComponent(minPrice)}`);
      if (maxPrice) params.push(`maxPrice=${encodeURIComponent(maxPrice)}`);
      if (params.length) url += `&${params.join('&')}`;
    }

    const res = await fetch(url);
    const data = await res.json();
    renderList(data);
  }

  function renderList(paged) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    const items = paged.content || [];
    items.forEach(p => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div>
          <div class="name">${p.name}</div>
          <div class="muted">${p.category ? p.category.name : ''}</div>
          <div>${p.description || ''}</div>
        </div>
        <div class="row">
          <div>
            <span class="price">₺${p.price}</span>
            <div class="muted">Stok: ${p.stock}</div>
          </div>
          ${p.stock > 0 
            ? `<button onclick="addToCart(${p.id})">Sepete Ekle</button>`
            : `<button disabled style="cursor: not-allowed; background-color: #ccc;">Tükendi</button>`
          }
        </div>
      `;
      list.appendChild(div);
    });
    document.getElementById('pageInfo').textContent = `Sayfa ${paged.number + 1} / ${Math.max(1, paged.totalPages || 1)} • Toplam: ${paged.totalElements}`;
  }

  async function addToCart(productId) {
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Lütfen önce giriş yapınız.');
      window.location.href = 'login.html';
      return;
    }

    try {
      const res = await fetch(`${base}/api/cart`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ productId: productId, quantity: 1 })
      });

      if (res.ok) {
        alert('Ürün sepete eklendi!');
      } else {
        const error = await res.json();
        alert(`Hata: ${error.message || 'Bir sorun oluştu.'}`);
      }
    } catch (err) {
      console.error('Sepete ekleme hatası:', err);
      alert('Bir hata oluştu.');
    }
  }

  function nextPage(){ page++; fetchProducts(); }
  function prevPage(){ if(page>0){ page--; fetchProducts(); } }
  function applyFilters(){ page = 0; fetchProducts(); }

  fetchProducts();
</script>
</body>
</html>
