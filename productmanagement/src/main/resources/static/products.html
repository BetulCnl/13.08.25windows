<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ürünler</title>
  <style>
    .product-card {
      border: 1px solid #333;
      padding: 15px;
      margin: 10px;
      display: inline-block;
      width: 200px;
      text-align: center;
    }
    button {
      padding: 5px 10px;
    }
  </style>
</head>
<body>
<h1 style="text-align:center;">Ürünler</h1>
<div style="text-align:center;">
  <button onclick="goToCart()">Sepetim</button>
</div>
<div id="productList" style="display:flex; flex-wrap: wrap; justify-content:center;"></div>

<script>
  const token = localStorage.getItem('token'); // JWT token

  // Tüm ürünleri getir
  async function loadProducts() {
    try {
      const response = await fetch('http://localhost:8080/api/products', {
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      });
      if (!response.ok) throw new Error("Ürünler yüklenemedi");
      const data = await response.json();

      const productList = document.getElementById('productList');
      productList.innerHTML = '';

      data.content.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
                <h3>${product.name}</h3>
                <p>${product.description || ''}</p>
                <p>Fiyat: ${product.price} TL</p>
                <button onclick="addToCart(${product.id})">Sepete Ekle</button>
            `;
        productList.appendChild(div);
      });
    } catch (error) {
      console.error(error);
      alert("Ürünler yüklenirken hata oluştu");
    }
  }
  //-----------------------
  //ürünlerin bulunduğu yerde sayfa numaralandırm

  //----------------------------
  // Sepete ekle
  async function addToCart(productId) {
    if (!token) {
      alert("Sepete eklemek için giriş yapmalısınız!");
      return;
    }

    try {
      const response = await fetch('http://localhost:8080/api/cart', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ productId, quantity: 1 })
      });

      if (!response.ok) throw new Error("Ürün sepete eklenemedi");
      alert(`Ürün ID ${productId} sepete eklendi!`);
    } catch (error) {
      console.error(error);
      alert("Sepete eklenirken hata oluştu");
    }
  }

  // Sepet sayfasına git
  function goToCart() {
    window.location.href = 'cart.html';
  }

  // Sayfa yüklendiğinde ürünleri yükle
  window.onload = loadProducts;
</script>
</body>
</html>
